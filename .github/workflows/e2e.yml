name: E2E

# Audit M14: Playwright end-to-end suite in CI.
#
# Boots the full stack (Postgres + Redis services → migrate + seed → backend
# API → production Next.js server) and runs the core smoke specs.
#
# Currently ADVISORY (continue-on-error: true) until the first fully green
# run is observed; flip it to blocking afterwards by removing that flag.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright smoke (chromium)
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pandamarket_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PD_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pandamarket_e2e
      PD_DATABASE_SSL: 'false'
      PD_REDIS_URL: redis://localhost:6379
      PD_NODE_ENV: development
      BACKEND_URL: http://localhost:9000
      E2E_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Build shared types + backend
        run: |
          npm run build -w @pandamarket/types
          npm run build -w @pandamarket/backend

      - name: Migrate database
        working-directory: backend
        run: npx tsx src/migrations/run.ts

      - name: Seed database
        working-directory: backend
        run: npx tsx data/seed.ts

      - name: Start backend API
        working-directory: backend
        run: |
          npx tsx src/main.ts > ../backend-e2e.log 2>&1 &
          echo $! > ../backend.pid

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/health > /dev/null; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend did not become healthy"
          tail -100 ../backend-e2e.log || true
          exit 1

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run start > ../frontend-e2e.log 2>&1 &
          echo $! > ../frontend.pid

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/pd/auth/csrf > /dev/null; then
              echo "frontend healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::frontend did not become healthy"
          tail -100 ../frontend-e2e.log || true
          exit 1

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke E2E specs
        working-directory: frontend
        run: >
          npx playwright test
          --project=chromium
          e2e/api-health.spec.ts
          e2e/auth-flow.spec.ts
          e2e/hub-navigation.spec.ts
          e2e/admin-panel.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Dump server logs on failure
        if: failure()
        run: |
          tail -200 backend-e2e.log || true
          tail -200 frontend-e2e.log || true
